<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <script>
    (function () {
      var m = localStorage.getItem('errata-theme') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom sticky-top">
    <div class="container-fluid gap-2">
      <a class="navbar-brand fw-semibold" href="./">{{TITLE}}</a>
      <input id="q" class="form-control flex-grow-1" style="max-width: 28rem" type="search" placeholder="搜索标题 / 标签 / 题干" aria-label="搜索">
      <div class="d-flex gap-2">
        <button id="random" class="btn btn-outline-primary" type="button">随机一题</button>
        <button id="theme" class="btn btn-outline-secondary" type="button" title="切换主题">自动</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <div class="row g-3">
      <aside class="col-12 col-lg-3 col-xl-2">
        <div class="d-lg-none mb-2">
          <button class="btn btn-outline-secondary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#filters">筛选</button>
 </div>
        <div id="filters" class="collapse d-lg-block">
   <h6 class="text-body-secondary">科目</h6>
          <div id="f-subject" class="list-group mb-3"></div>
   <h6 class="text-body-secondary">题型</h6>
          <div id="f-type" class="list-group mb-3"></div>
          <h6 class="text-body-secondary">标签</h6>
   <div id="f-tag" class="d-flex flex-wrap gap-1"></div>
        </div>
      </aside>

      <section class="col-12 col-lg-9 col-xl-10">
        <div class="d-flex justify-content-between align-items-center mb-2">
   <span id="count" class="text-body-secondary"></span>
          <button id="reset" class="btn btn-sm btn-link" type="button">清除筛选</button>
        </div>
        <div id="list" class="list-group"></div>
        <p id="empty" class="text-body-secondary text-center py-5 d-none">没有符合条件的题目</p>
      </section>
    </div>
  </main>

  <div class="modal fade" id="detail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
   <div>
            <h5 class="modal-title" id="d-title"></h5>
     <div id="d-meta" class="d-flex flex-wrap gap-1 mt-1"></div>
   </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
 </div>
        <div class="modal-body">
          <div id="d-stem" class="mb-3"></div>
   <div class="accordion" id="d-acc">
     <div class="accordion-item" id="d-answer-wrap">
       <h2 class="accordion-header">
  <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#d-answer-body">答案</button>
       </h2>
       <div id="d-answer-body" class="accordion-collapse collapse">
  <div class="accordion-body" id="d-answer"></div>
</div>
            </div>
     <div class="accordion-item" id="d-solution-wrap">
       <h2 class="accordion-header">
         <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#d-solution-body">解析</button>
       </h2>
       <div id="d-solution-body" class="accordion-collapse collapse">
  <div class="accordion-body" id="d-solution"></div>
       </div>
     </div>
          </div>
 </div>
        <div class="modal-footer justify-content-between">
   <span id="d-source" class="text-body-secondary"></span>
          <div class="btn-group">
     <button id="prev" class="btn btn-outline-secondary" type="button">上一题</button>
     <button id="next" class="btn btn-outline-secondary" type="button">下一题</button>
          </div>
 </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
