<!doctype html>
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Errata editor</title>
  <script>
    (function () {
      var m = localStorage.getItem('errata-theme') || 'auto';
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-body-tertiary border-bottom sticky-top">
    <div class="container-fluid gap-2">
      <span class="navbar-brand fw-semibold" id="brand">Errata</span>
      <div class="d-flex gap-2 ms-auto align-items-center">
 <span id="dirty" class="text-body-secondary small"></span>
        <button id="new" class="btn btn-primary" type="button">新建题目</button>
        <button id="sync" class="btn btn-outline-secondary" type="button">同步</button>
        <button id="theme" class="btn btn-outline-secondary" type="button">自动</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-3">
    <div class="row g-3">
      <aside class="col-12 col-lg-4 col-xl-3">
        <input id="q" class="form-control mb-2" type="search" placeholder="搜索题号 / 标题 / 标签" aria-label="搜索">
        <div class="row g-2 mb-2">
   <div class="col-6"><select id="f-subject" class="form-select" aria-label="科目"></select></div>
          <div class="col-6"><select id="f-type" class="form-select" aria-label="题型"></select></div>
 </div>
        <div id="count" class="text-body-secondary small mb-2"></div>
 <div id="list" class="list-group" style="max-height: 70vh; overflow-y: auto"></div>
 <p id="list-empty" class="text-body-secondary py-4 text-center d-none">还没有题目。点击“新建题目”开始。</p>
      </aside>

      <section class="col-12 col-lg-8 col-xl-9">
        <div id="welcome" class="text-body-secondary text-center py-5">选择左侧题目，或新建一道。</div>

        <form id="editor" class="d-none" autocomplete="off">
   <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
     <h5 id="e-heading" class="mb-0 me-auto"></h5>
     <button id="e-delete" class="btn btn-outline-danger" type="button">删除</button>
     <button id="e-save" class="btn btn-primary" type="submit">保存</button>
          </div>
   <div id="e-errors" class="alert alert-danger d-none" role="alert"></div>

   <div class="row g-3 mb-3">
     <div class="col-12 col-xl-6">
<label class="form-label" for="e-title">标题</label>
<input id="e-title" class="form-control" required>
     </div>
     <div class="col-6 col-md-3 col-xl-3">
       <label class="form-label" for="e-subject">科目</label>
       <div class="input-group">
  <select id="e-subject" class="form-select"></select>
         <button class="btn btn-outline-secondary" type="button" data-add="subject" title="新增科目" aria-label="新增科目">+</button>
</div>
            </div>
     <div class="col-6 col-md-3 col-xl-3">
       <label class="form-label" for="e-type">题型</label>
       <div class="input-group">
         <select id="e-type" class="form-select"></select>
  <button class="btn btn-outline-secondary" type="button" data-add="type" title="新增题型" aria-label="新增题型">+</button>
       </div>
     </div>
     <div class="col-12 col-md-6">
       <label class="form-label" for="e-tags">标签（英文 kebab-case，逗号分隔）</label>
<input id="e-tags" class="form-control" list="tag-options" placeholder="quadratic-function, case-analysis">
       <datalist id="tag-options"></datalist>
       <div id="e-tag-hint" class="form-text"></div>
     </div>
     <div class="col-8 col-md-4">
       <label class="form-label" for="e-source">来源</label>
       <input id="e-source" class="form-control">
            </div>
     <div class="col-4 col-md-2">
       <label class="form-label" for="e-difficulty">难度</label>
<select id="e-difficulty" class="form-select">
         <option value="0">未设置</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
       </select>
     </div>
   </div>

   <ul class="nav nav-tabs mb-2" id="e-tabs" role="tablist"></ul>
          <div class="row g-3">
            <div class="col-12 col-xl-6">
       <textarea id="e-text" class="form-control font-monospace" rows="16" spellcheck="false" aria-label="正文"></textarea>
       <div class="d-flex flex-wrap gap-2 mt-2 align-items-center">
  <label class="btn btn-outline-secondary btn-sm mb-0" for="e-image">插入图片</label>
         <input id="e-image" type="file" accept="image/png,image/jpeg,image/gif,image/webp" class="d-none">
  <span class="form-text mb-0">也可直接把图片粘贴到文本框。公式用 $…$ 与 $$…$$。</span>
       </div>
     </div>
            <div class="col-12 col-xl-6">
       <div class="border rounded p-3 h-100" style="min-height: 12rem" id="e-preview" aria-live="polite"></div>
     </div>
   </div>
        </form>
      </section>
    </div>
  </main>

  <div class="modal fade" id="add-modal" tabindex="-1" aria-labelledby="add-title" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="add-form">
        <div class="modal-header">
          <h5 class="modal-title" id="add-title"></h5>
   <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
   <div class="mb-3">
     <label class="form-label" for="add-id">id（小写英文 kebab-case，用作目录名）</label>
            <input id="add-id" class="form-control" required pattern="[a-z0-9]+(-[a-z0-9]+)*">
   </div>
          <div class="mb-3">
     <label class="form-label" for="add-name">显示名称</label>
     <input id="add-name" class="form-control" required>
   </div>
          <div id="add-error" class="text-danger d-none"></div>
        </div>
        <div class="modal-footer">
   <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
   <button type="submit" class="btn btn-primary">添加</button>
 </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="sync-modal" tabindex="-1" aria-labelledby="sync-title" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
   <h5 class="modal-title" id="sync-title">同步</h5>
   <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
 <div class="modal-body">
   <pre id="sync-log" class="mb-0" style="white-space: pre-wrap"></pre>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
      <div class="toast-body" id="toast-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
